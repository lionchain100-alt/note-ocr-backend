<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海鲜帮监控仪表盘 | Seafood Gang Monitor</title>
    <meta property="og:title" content="海鲜帮监控仪表盘">
    <meta property="og:description" content="海鲜帮 8 人团队实时监控面板">
    <meta property="og:image" content="http://170.106.191.236/heartbeat-og.png">
    <style>
        :root {
            --bg: #0a0a1a;
            --card: #12122a;
            --card-hover: #1a1a3a;
            --border: #2a2a4a;
            --text: #e0e0f0;
            --text-dim: #8080a0;
            --green: #00e676;
            --green-dim: #00e67640;
            --yellow: #ffc107;
            --yellow-dim: #ffc10740;
            --red: #ff5252;
            --red-dim: #ff525240;
            --blue: #448aff;
            --purple: #b388ff;
            --pink: #ff80ab;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* 背景粒子 */
        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle { position: absolute; border-radius: 50%; animation: float linear infinite; }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        .container { position: relative; z-index: 1; padding: 20px; max-width: 1400px; margin: 0 auto; }
        /* 头部 */
        .header { text-align: center; padding: 30px 0 20px; }
        .header h1 { font-size: 36px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, var(--blue), var(--purple), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header .subtitle { color: var(--text-dim); font-size: 14px; margin-top: 8px; letter-spacing: 1px; }
        .header .live-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; background: var(--green-dim); color: var(--green); font-size: 12px; margin-top: 12px; }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        /* 统计卡片 */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin: 24px 0; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; transition: all 0.3s; }
        .stat-card:hover { background: var(--card-hover); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
        .stat-card .value { font-size: 32px; font-weight: 700; margin: 8px 0; }
        .stat-card .label { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .icon { font-size: 24px; }
        /* Agent 网格 */
        .agent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin: 24px 0; }
        .agent-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; transition: all 0.3s; position: relative; overflow: hidden; }
        .agent-card:hover { background: var(--card-hover); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
        .agent-card .status-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
        .agent-card .status-bar.online { background: linear-gradient(90deg, var(--green), transparent); }
        .agent-card .status-bar.offline { background: linear-gradient(90deg, var(--red), transparent); }
        .agent-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .agent-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .agent-info { flex: 1; }
        .agent-name { font-size: 18px; font-weight: 600; }
        .agent-role { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
        .agent-status { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
        .agent-status.online { background: var(--green-dim); color: var(--green); }
        .agent-status.offline { background: var(--red-dim); color: var(--red); }
        .agent-status.idle { background: var(--yellow-dim); color: var(--yellow); }
        .agent-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .detail { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 10px; }
        .detail .label { color: var(--text-dim); font-size: 11px; margin-bottom: 4px; }
        .detail .value { font-size: 14px; font-weight: 500; }
        /* 心跳动画 */
        .heart-section { text-align: center; margin: 40px 0; padding: 30px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
        .heart { display: inline-block; width: 60px; height: 55px; position: relative; animation: heartbeat 1.2s ease-in-out infinite; filter: drop-shadow(0 0 20px rgba(255, 60, 100, 0.6)); }
        .heart::before, .heart::after { content: ''; position: absolute; width: 30px; height: 48px; background: linear-gradient(135deg, #ff3c64, #ff6b8a); border-radius: 30px 30px 0 0; }
        .heart::before { left: 30px; transform: rotate(-45deg); transform-origin: 0 100%; }
        .heart::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.15); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } 60% { transform: scale(1); } }
        .bpm-display { font-size: 48px; font-weight: 300; color: var(--pink); margin-top: 16px; }
        .bpm-display span { font-size: 18px; color: var(--text-dim); }
        /* Git 状态 */
        .git-section { margin: 24px 0; padding: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
        .git-section h2 { font-size: 20px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .git-repos { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
        .git-repo { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 12px; }
        .git-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .git-icon.clean { background: var(--green-dim); }
        .git-icon.dirty { background: var(--red-dim); }
        .git-info { flex: 1; }
        .git-name { font-weight: 600; font-size: 14px; }
        .git-status { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
        /* 响应式 */
        @media (max-width: 600px) {
            .header h1 { font-size: 24px; }
            .agent-grid { grid-template-columns: 1fr; }
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div id="particles"></div>
    <div class="container">
        <div class="header">
            <h1>🦞 海鲜帮监控仪表盘</h1>
            <p class="subtitle">SEAFOOD GANG MONITOR v2.0 | 海鲜帮 8 人团队实时监控</p>
            <div class="live-badge"><div class="live-dot"></div> LIVE | 实时更新中</div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats" id="stats"></div>

        <!-- Agent 网格 -->
        <h2 style="font-size:20px; margin: 24px 0 16px;">👥 Agent 实时状态</h2>
        <div class="agent-grid" id="agent-grid"></div>

        <!-- Git 状态 -->
        <div class="git-section">
            <h2>📦 代码仓库状态</h2>
            <div class="git-repos" id="git-repos"></div>
        </div>

        <!-- 心跳 -->
        <div class="heart-section">
            <div class="heart"></div>
            <div class="bpm-display" id="bpm">0.033 <span>BPM (心跳轮询)</span></div>
            <p style="color:var(--text-dim); font-size:12px; margin-top:8px;">每 30 分钟一次 · 比冬眠的树懒还慢 🦥</p>
        </div>

        <p style="text-align:center; color:var(--text-dim); font-size:12px; padding:20px 0;">
            海鲜帮监控仪表盘 · Powered by OpenClaw 🦞 · <span id="timestamp"></span>
        </p>
    </div>

    <script>
        // Agent 数据
        const agents = [
            { emoji: '🦞', name: '虾总', id: 'main', role: '总管调度', status: 'online', model: 'qwen3.6-plus', channel: 'heartbeat', tokens: '163,471', lastActive: '实时' },
            { emoji: '🦀', name: '码蟹', id: 'maxie', role: '技术开发', status: 'idle', model: 'qwen3.6-plus', channel: 'feishu', tokens: '22,080', lastActive: '5天前' },
            { emoji: '🐋', name: '产品鲸理', id: 'jingli', role: '产品规划', status: 'idle', model: 'qwen3.6-plus', channel: 'telegram', tokens: '26,759', lastActive: '5天前' },
            { emoji: '🦈', name: '文鲨', id: 'wensha', role: '内容&SEO', status: 'idle', model: 'qwen3.5-plus', channel: 'feishu', tokens: '42,142', lastActive: '5天前' },
            { emoji: '📊', name: '数蛸', id: 'shushao', role: '数据分析', status: 'idle', model: 'qwen3.6-plus', channel: 'feishu', tokens: '20,265', lastActive: '5天前' },
            { emoji: '🍱', name: '增鳗', id: 'zengman', role: '增长黑客', status: 'idle', model: 'glm-5.1', channel: 'telegram', tokens: '22,489', lastActive: '5天前' },
            { emoji: '🦑', name: '译鱿', id: 'yiyou', role: '本地化', status: 'idle', model: 'qwen3.6-plus', channel: 'telegram', tokens: '37,147', lastActive: '5天前' },
            { emoji: '🦪', name: '客蚝', id: 'kehao', role: '客服', status: 'idle', model: 'qwen3.6-plus', channel: 'telegram', tokens: '34,645', lastActive: '5天前' }
        ];

        const avatarColors = ['#ff3c64', '#ff6b3c', '#448aff', '#2196f3', '#00bcd4', '#4caf50', '#ff9800', '#9c27b0'];

        // 渲染统计
        const onlineCount = agents.filter(a => a.status === 'online').length;
        const totalTokens = agents.reduce((sum, a) => sum + parseInt(a.tokens.replace(',', '')), 0);
        const statsHTML = `
            <div class="stat-card"><div class="icon">👥</div><div class="value">8</div><div class="label">总 Agent 数</div></div>
            <div class="stat-card"><div class="icon" style="color:var(--green)">●</div><div class="value" style="color:var(--green)">${onlineCount}</div><div class="label">在线</div></div>
            <div class="stat-card"><div class="icon" style="color:var(--yellow)">●</div><div class="value" style="color:var(--yellow)">${agents.length - onlineCount}</div><div class="label">待机</div></div>
            <div class="stat-card"><div class="icon">📊</div><div class="value">${(totalTokens / 1000).toFixed(1)}K</div><div class="label">总 Token 消耗</div></div>
            <div class="stat-card"><div class="icon">🔗</div><div class="value">2</div><div class="label">接入渠道</div></div>
            <div class="stat-card"><div class="icon">💰</div><div class="value">$0</div><div class="label">预估成本</div></div>
        `;
        document.getElementById('stats').innerHTML = statsHTML;

        // 渲染 Agent 卡片
        const agentGrid = document.getElementById('agent-grid');
        agents.forEach((agent, i) => {
            const card = document.createElement('div');
            card.className = 'agent-card';
            card.innerHTML = `
                <div class="status-bar ${agent.status === 'online' ? 'online' : 'offline'}"></div>
                <div class="agent-header">
                    <div class="agent-avatar" style="background:${avatarColors[i]}20; color:${avatarColors[i]}">${agent.emoji}</div>
                    <div class="agent-info">
                        <div class="agent-name">${agent.name}</div>
                        <div class="agent-role">${agent.role}</div>
                    </div>
                    <div class="agent-status ${agent.status}">${agent.status === 'online' ? '在线' : '待机'}</div>
                </div>
                <div class="agent-details">
                    <div class="detail"><div class="label">模型</div><div class="value">${agent.model}</div></div>
                    <div class="detail"><div class="label">渠道</div><div class="value">${agent.channel}</div></div>
                    <div class="detail"><div class="label">Token 消耗</div><div class="value">${agent.tokens}</div></div>
                    <div class="detail"><div class="label">最后活跃</div><div class="value">${agent.lastActive}</div></div>
                </div>
            `;
            agentGrid.appendChild(card);
        });

        // Git 状态
        const gitRepos = [
            { name: 'image-to-text', status: 'clean', desc: '0 未提交更改' },
            { name: 'note-ocr-backend', status: 'clean', desc: '0 未提交更改' }
        ];
        const gitHTML = gitRepos.map(repo => `
            <div class="git-repo">
                <div class="git-icon ${repo.status}">${repo.status === 'clean' ? '✅' : '⚠️'}</div>
                <div class="git-info">
                    <div class="git-name">${repo.name}</div>
                    <div class="git-status">${repo.desc}</div>
                </div>
            </div>
        `).join('');
        document.getElementById('git-repos').innerHTML = gitHTML;

        // 粒子
        const particlesEl = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (5 + Math.random() * 10) + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            const size = 2 + Math.random() * 4;
            p.style.width = p.style.height = size + 'px';
            p.style.background = `rgba(${100 + Math.random()*155}, ${60 + Math.random()*100}, ${150 + Math.random()*105}, 0.3)`;
            particlesEl.appendChild(p);
        }

        // 时间戳
        document.getElementById('timestamp').textContent = new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });
    </script>
</body>
</html>
